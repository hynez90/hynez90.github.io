<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation</title>

<style>
       * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: #000;
    }

    /*
     * Full-screen area
     */
    .scene {
        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100vh;

        display: flex;

        justify-content: center;
        align-items: center;

        perspective: 2000px;
    }

    /*
     * A4 invitation
     *
     * A4 ratio:
     * 210 / 297 = 0.707
     */
    .card {
        position: relative;

        width: min(100vw, 70.707vh);
        height: min(141.421vw, 100vh);

        aspect-ratio: 210 / 297;

        transform-style: preserve-3d;

        cursor: pointer;

        transition:
            transform 1.5s cubic-bezier(.65, .05, .36, 1);
    }

    /*
     * Open invitation
     */
    .card.open {
        transform: rotateY(180deg);
    }

    /*
     * Front and back
     */
    .face {
        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
    }

    /*
     * Front cover
     */
    .front {
        transform: rotateY(0deg);
    }

    /*
     * Back / venue details
     */
    .back {
        transform: rotateY(180deg);
    }

    /*
     * SVG artwork
     *
     * contain = entire A4 artwork remains visible
     */
    .face img {
        display: block;

        width: 100%;
        height: 100%;

        object-fit: contain;

        object-position: center;
    }

    /*
     * Tap instruction
     */
    .instruction {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 25px;

        text-align: center;

        color: white;

        font-family: Georgia, serif;

        font-size: 14px;

        letter-spacing: 0.15em;

        text-shadow:
            0 1px 6px rgba(0,0,0,.7);

        pointer-events: none;

        opacity: .9;

        transition:
            opacity .5s ease;
    }

    /*
     * Hide instruction after opening
     */
    .card.open ~ .instruction {
        opacity: 0;
    }

    /*
     * Phones
     */
    @media (max-width: 600px) {

        .instruction {
            bottom: 18px;
            font-size: 12px;
        }

    }

    /*
     * Accessibility
     */
    @media (prefers-reduced-motion: reduce) {

        .card {
            transition: none;
        }

    }

</style>
</head>


<body>

    <div class="scene">

        <div class="card" id="invitation">

            <!-- FRONT / COVER -->
            <div class="face front">
                <img
                    src="svgs\WeddingInviteCoverV1.5.svg"
                    alt="Wedding invitation cover">
            </div>

            <!-- BACK / VENUE DETAILS -->
            <div class="face back">
                <img
                    src="svgs\WeddingInviteDetailsDayGuestV1.5.svg"
                    alt="Wedding venue and details">
            </div>

        </div>

    </div>


    <div class="instruction">
        TAP TO OPEN
    </div>


<script>

    const invitation =
        document.getElementById("invitation");

    invitation.addEventListener("click", function () {

        this.classList.toggle("open");

    });

</script>

</body>
</html>
