<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
}

.scene {
    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    perspective: 2000px;
}

.card {
    position: relative;

    /*
     * Use the full available height.
     * A4 ratio is preserved automatically.
     */
    height: 100vh;
    width: auto;

    aspect-ratio: 210 / 297;

    transform-style: preserve-3d;

    cursor: pointer;

    transition:
        transform 1.5s cubic-bezier(.65, .05, .36, 1);
}

.face {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    overflow: hidden;
}

.face img {
    display: block;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    /*
     * Do NOT crop the invitation.
     */
    object-fit: fill;
}

.front {
    transform: rotateY(0deg);
}

.back {
    transform: rotateY(180deg);
}

.card.open {
    transform: rotateY(180deg);
}

/*
 * On very narrow screens, constrain by width
 */
@media (max-aspect-ratio: 210/297) {

    .card {
        width: 100vw;
        height: auto;

        aspect-ratio: 210 / 297;
    }

}

.instruction {
    position: fixed;

    left: 0;
    right: 0;
    top: 20px;

    text-align: center;

    color: white;

    font-family: Georgia, serif;

    font-size: 13px;

    letter-spacing: .12em;

    pointer-events: none;

    text-shadow:
        0 1px 5px rgba(0,0,0,.6);

    transition: opacity .5s ease;
}

.card.open ~ .instruction {
    opacity: 0;
}
</style>
</head>


<body>

    <div class="scene">

        <div class="card" id="invitation">

            <!-- FRONT / COVER -->
            <div class="face front">
                <img
                    src="svgs\WeddingInviteCoverV1.5.svg"
                    alt="Wedding invitation cover">
            </div>

            <!-- BACK / VENUE DETAILS -->
            <div class="face back">
                <img
                    src="svgs\WeddingInviteDetailsDayGuestV1.5.svg"
                    alt="Wedding venue and details">
            </div>

        </div>

    </div>


    <div class="instruction">
        TAP TO OPEN
    </div>


<script>

    const invitation =
        document.getElementById("invitation");

    invitation.addEventListener("click", function () {

        this.classList.toggle("open");

    });

</script>

</body>
</html>
