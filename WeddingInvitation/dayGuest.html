<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
}

/*
 * The actual visible browser viewport.
 *
 * dvh = dynamic viewport height.
 * This is important on phones because
 * the browser address bar changes the
 * usable viewport height.
 */
#stage {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100dvh;

    display: grid;
    place-items: center;

    perspective: 1800px;

    overflow: hidden;
}

/*
 * A4 portrait card
 *
 * 210 / 297 = 0.70707
 */
#card {
    position: relative;

    width: min(100vw, calc(100dvh * 0.70707));
    height: min(100dvh, calc(100vw * 1.41414));

    aspect-ratio: 210 / 297;

    margin: 0;

    transform-style: preserve-3d;

    transition:
        transform 1.4s cubic-bezier(.65, .05, .36, 1);

    cursor: pointer;
}

/*
 * Both sides of invitation
 */
.face {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

/*
 * Your actual SVG
 */
.face img {
    display: block;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    object-fit: fill;
}

/*
 * Front
 */
.front {
    transform: rotateY(0deg);
}

/*
 * Back
 */
.back {
    transform: rotateY(180deg);
}

/*
 * Open
 */
#card.open {
    transform: rotateY(180deg);
}

/*
 * Tap instruction
 */
#instruction {
    position: fixed;

    left: 0;
    bottom: max(16px, env(safe-area-inset-bottom));

    width: 100%;

    text-align: center;

    color: white;

    font-family: Georgia, serif;

    font-size: 13px;

    letter-spacing: .12em;

    text-shadow:
        0 1px 5px rgba(0,0,0,.7);

    pointer-events: none;

    transition: opacity .5s ease;
}

#card.open ~ #instruction {
    opacity: 0;
}


/*
 * Older browsers that don't understand dvh
 */
@supports not (height: 100dvh) {

    #stage {
        height: 100vh;
    }

    #card {
        width: min(100vw, 70.707vh);
        height: min(100vh, 141.414vw);
    }

}


/*
 * Phones in portrait orientation
 */
@media (orientation: portrait) {

    #card {
        height: min(100dvh, 141.414vw);
        width: calc(min(100dvh, 141.414vw) * 0.70707);
    }

}


/*
 * Phones in landscape orientation
 */
@media (orientation: landscape) {

    #card {
        width: min(100vw, 70.707dvh);
        height: calc(min(100vw, 70.707dvh) * 1.41414);
    }

}

</style>
</head>


<body>

    <div class="scene">

        <div class="card" id="invitation">

            <!-- FRONT / COVER -->
            <div class="face front">
                <img
                    src="svgs\WeddingInviteCoverV1.5.svg"
                    alt="Wedding invitation cover">
            </div>

            <!-- BACK / VENUE DETAILS -->
            <div class="face back">
                <img
                    src="svgs\WeddingInviteDetailsDayGuestV1.5.svg"
                    alt="Wedding venue and details">
            </div>

        </div>

    </div>


    <div class="instruction">
        TAP TO OPEN
    </div>


<script>

    const invitation =
        document.getElementById("invitation");

    invitation.addEventListener("click", function () {

        this.classList.toggle("open");

    });

</script>

</body>
</html>
